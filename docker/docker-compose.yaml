version: "3.9"

services:
  # === Core Service ===
  aio-core:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: aio-core
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://aio:aio@aio-postgres:5432/aio
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT:-}
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY:-}
    volumes:
      - ../config:/app/config:ro
      - aio-data:/data
    depends_on:
      aio-postgres:
        condition: service_healthy
    restart: unless-stopped

  # === PostgreSQL ===
  aio-postgres:
    image: postgres:16-alpine
    container_name: aio-postgres
    environment:
      POSTGRES_USER: aio
      POSTGRES_PASSWORD: aio
      POSTGRES_DB: aio
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aio"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # === MCP Servers ===
  aio-mcp-filesystem:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: aio-mcp-filesystem
    command: ["python", "-m", "aio.mcp.servers.filesystem"]
    volumes:
      - aio-data:/data
    restart: unless-stopped

  aio-mcp-terminal:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: aio-mcp-terminal
    command: ["python", "-m", "aio.mcp.servers.terminal"]
    restart: unless-stopped

  aio-mcp-websearch:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: aio-mcp-websearch
    command: ["python", "-m", "aio.mcp.servers.websearch"]
    restart: unless-stopped

  aio-mcp-browser:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: aio-mcp-browser
    command: ["python", "-m", "aio.mcp.servers.browser"]
    restart: unless-stopped

volumes:
  postgres-data:
  aio-data:
